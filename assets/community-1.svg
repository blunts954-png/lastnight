<svg width="600" height="800" viewBox="0 0 600 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="800" fill="#0a0a0a"/>
  <rect x="50" y="100" width="500" height="600" fill="#111"/>
  <!-- Silhouette -->
  <ellipse cx="300" cy="300" rx="80" ry="100" fill="#1a1a1a"/>
  <rect x="220" y="380" width="160" height="280" rx="8" fill="#1a1a1a"/>
  <!-- Grain effect pattern -->
  <pattern id="grain" patternUnits="userSpaceOnUse" width="100" height="100">
    <rect width="100" height="100" fill="transparent"/>
    <circle cx="10" cy="10" r="1" fill="#222" opacity="0.3"/>
    <circle cx="30" cy="50" r="1" fill="#222" opacity="0.3"/>
    <circle cx="70" cy="20" r="1" fill="#222" opacity="0.3"/>
    <circle cx="90" cy="80" r="1" fill="#222" opacity="0.3"/>
    <circle cx="50" cy="90" r="1" fill="#222" opacity="0.3"/>
  </pattern>
  <rect width="600" height="800" fill="url(#grain)"/>
  <!-- CCTV overlay -->
  <text x="30" y="50" font-family="monospace" font-size="14" fill="#FF0000">REC ●</text>
  <text x="30" y="780" font-family="monospace" font-size="12" fill="#333">CAM_01 // 03:47:22</text>
</svg>
